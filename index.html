<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fashion Portfolio — Studio</title><style>
:root{--bg:#f4f2ed;--ink:#191919;--muted:#777;--line:#d9d6cf;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 5%;border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;letter-spacing:.12em;font-size:19px;cursor:pointer}.nav{display:flex;gap:22px;align-items:center}.link{border:0;background:none;padding:8px 0;color:inherit}.small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}main{max-width:1400px;margin:auto;padding:48px 5% 100px}.hero{display:flex;justify-content:space-between;align-items:end;gap:30px;padding:45px 0 65px}.hero h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(54px,9vw,125px);line-height:.96;letter-spacing:-.06em;margin:18px 0}.hero p{max-width:330px;line-height:1.6;color:#555}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0 26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.tile{cursor:pointer}.cover{aspect-ratio:3/4;background:#e4e1db;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.placeholder{font-family:Georgia,serif;font-size:clamp(35px,5vw,70px);color:#a8a49c}.tile h3{font-family:Georgia,serif;font-size:23px;font-weight:400;margin:15px 0 5px}.tile .small{margin-top:8px}.pill{border:1px solid var(--ink);background:transparent;padding:11px 17px;font-size:12px;letter-spacing:.08em}.pill.dark{background:var(--ink);color:white}.pill:disabled{opacity:.3;cursor:not-allowed}.viewerhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.viewerhead h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(32px,5vw,65px);margin:10px 0}.book{background:#e9e6e0;min-height:490px;display:flex;align-items:center;justify-content:center;padding:25px;position:relative}.page{background:white;width:min(100%,850px);min-height:440px;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 35px #00000012}.page img{max-width:100%;max-height:70vh;object-fit:contain}.empty{color:#888;text-align:center;line-height:1.8;padding:40px}.controls{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.intro{max-width:650px;line-height:1.7;color:#555}.panel{border:1px solid var(--line);padding:24px;margin:24px 0;background:#fff}.panel h3{margin-top:0;font-family:Georgia,serif;font-weight:400;font-size:27px}.field{display:block;margin:15px 0}.field span{display:block;font-size:12px;color:#666;margin-bottom:7px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #ccc;background:#fff}.field textarea{min-height:90px}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.thumbs{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.thumb{width:110px;border:1px solid #ddd;padding:6px;background:#fafafa}.thumb img{width:100%;height:90px;object-fit:contain}.thumb button{font-size:11px;border:0;background:none;padding:7px 3px}.notice{font-size:12px;color:#777;line-height:1.7}.hide{display:none!important}footer{padding:35px 5%;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.editor-toggle{border:1px solid var(--line);background:transparent;padding:9px 12px;font-size:12px}.about{max-width:650px;font-family:Georgia,serif;font-size:clamp(24px,4vw,43px);line-height:1.3;margin:60px 0}.filebutton{position:relative;overflow:hidden;display:inline-flex}.filebutton input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}@media(max-width:750px){header{padding:0 5%;height:64px}.nav{gap:10px}.hero{display:block;padding:30px 0 50px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}.book{padding:10px;min-height:350px}.page{min-height:320px}.viewerhead{align-items:start}.viewerhead h2{font-size:35px}.pill{padding:9px 12px}.brand{font-size:15px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.cover{aspect-ratio:4/3}.nav .small{display:none}}
</style></head><body><header><div class="brand" onclick="goHome()" id="siteBrand">YOUR NAME / STUDIO</div><nav class="nav"><button class="link small" onclick="goHome()">Collections</button><button class="link small" onclick="showAbout()">About</button><button class="editor-toggle" onclick="toggleEditor()" id="editBtn">Edit site</button></nav></header><main id="app"></main><footer><span class="small" id="footBrand">YOUR NAME / STUDIO</span><span class="small">Independent fashion portfolio · <span id="year"></span></span></footer><script>
const DB='fashion_portfolio_starter_v1';let db,projects=[],settings={name:'YOUR NAME / STUDIO',tagline:'Fashion design, concepts & collections.',about:'An evolving portfolio of fashion concepts, visual research, moodboards and collection lineups.',email:''},editing=false,view='home',active=null,page=0;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('data')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function get(k){return new Promise((res,rej)=>{let t=db.transaction('data'),r=t.objectStore('data').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(k,v){return new Promise((res,rej)=>{let t=db.transaction('data','readwrite');t.objectStore('data').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function save(){await Promise.all([put('projects',projects),put('settings',settings)])}function id(){return 'p'+Date.now()+Math.random().toString(36).slice(2,7)}function syncBrand(){$('#siteBrand').textContent=settings.name;$('#footBrand').textContent=settings.name;document.title=settings.name+' — Portfolio'}function goHome(){view='home';active=null;render()}function showAbout(){view='about';render()}function toggleEditor(){editing=!editing;$('#editBtn').textContent=editing?'Done editing':'Edit site';render()}function openProject(i){active=i;page=0;view='project';render()}function render(){syncBrand();let a=$('#app');if(view==='about'){a.innerHTML=`<div class="small">ABOUT / CONTACT</div><div class="about">${esc(settings.about)}</div>${settings.email?`<p><a href="mailto:${esc(settings.email)}">${esc(settings.email)}</a></p>`:''}${editing?settingsEditor():''}`;return}if(view==='project'){let p=projects.find(x=>x.id===active);if(!p){goHome();return}let slides=p.pages||[];page=Math.max(0,Math.min(page,Math.max(0,slides.length-1)));a.innerHTML=`<div class="viewerhead"><div><button class="link small" onclick="goHome()">← All collections</button><h2>${esc(p.title)}</h2><div class="small">${esc(p.category||'Fashion collection')} · ${esc(p.year||'')}</div></div><div class="small">${slides.length?`${page+1} / ${slides.length}`:'0 / 0'}</div></div><p class="intro">${esc(p.description||'')}</p><div class="book"><div class="page">${slides.length?`<img src="${slides[page].image}" alt="${esc(slides[page].caption||p.title)}">`:`<div class="empty">Your collection is ready.<br>Add moodboards, lineups or other pages in Edit mode.</div>`}</div></div><div class="controls"><button class="pill" onclick="prevPage()" ${page===0?'disabled':''}>← Previous</button><span class="small">${slides.length?esc(slides[page].caption||'Collection page'):'No pages yet'}</span><button class="pill" onclick="nextPage()" ${page>=slides.length-1?'disabled':''}>Next →</button></div>${editing?projectEditor(p):''}`;return}a.innerHTML=`<div class="hero"><div><div class="small">SELECTED WORKS / PORTFOLIO</div><h1>Fashion<br>Portfolio.</h1></div><p>${esc(settings.tagline)}</p></div><div class="sectionhead"><span class="small">COLLECTIONS — ${String(projects.length).padStart(2,'0')}</span>${editing?'<button class="pill dark" onclick="addProject()">+ New collection</button>':''}</div><div class="grid">${projects.map((p,i)=>`<article class="tile" onclick="openProject('${p.id}')"><div class="cover">${p.pages?.length?`<img src="${p.pages[0].image}" alt="${esc(p.title)}">`:`<span class="placeholder">${String(i+1).padStart(2,'0')}</span>`}</div><h3>${esc(p.title)}</h3><div class="small">${esc(p.category||'Collection')} ${esc(p.year||'')}</div></article>`).join('')}</div>${editing?settingsEditor():''}`}
function settingsEditor(){return `<div class="panel"><h3>Site settings</h3><label class="field"><span>Studio / designer name</span><input id="sname" value="${esc(settings.name)}"></label><label class="field"><span>Homepage introduction</span><textarea id="stag">${esc(settings.tagline)}</textarea></label><label class="field"><span>About text</span><textarea id="sabout">${esc(settings.about)}</textarea></label><label class="field"><span>Contact email</span><input id="semail" value="${esc(settings.email)}"></label><div class="actions"><button class="pill dark" onclick="saveSettings()">Save settings</button><button class="pill" onclick="exportBackup()">Export backup (.json)</button><label class="pill filebutton">Import backup<input type="file" accept="application/json,.json" onchange="importBackup(event)"></label></div><p class="notice">Images are stored locally in this browser, not uploaded to a server. Export a backup after changes and keep it somewhere safe. Other devices will not automatically sync.</p></div>`}async function saveSettings(){settings={name:$('#sname').value||'YOUR NAME / STUDIO',tagline:$('#stag').value,about:$('#sabout').value,email:$('#semail').value};await save();render()}
function projectEditor(p){return `<div class="panel"><h3>Edit collection</h3><label class="field"><span>Title</span><input id="ptitle" value="${esc(p.title)}"></label><label class="field"><span>Category</span><input id="pcategory" value="${esc(p.category||'')}"></label><label class="field"><span>Year</span><input id="pyear" value="${esc(p.year||'')}"></label><label class="field"><span>Description</span><textarea id="pdesc">${esc(p.description||'')}</textarea></label><div class="actions"><button class="pill dark" onclick="saveProjectInfo()">Save details</button><label class="pill filebutton">+ Add images<input type="file" accept="image/*" multiple onchange="addImages(event)"></label><button class="pill" onclick="deleteProject()">Delete collection</button></div><p class="notice">Add images in reading order: moodboard, development, lineup. First image becomes the collection cover. Large files may exceed browser storage limits; compressed JPG/WebP images are recommended.</p><div class="thumbs">${(p.pages||[]).map((s,i)=>`<div class="thumb"><img src="${s.image}"><div class="actions"><button onclick="movePage(${i},-1)" title="Move left">←</button><button onclick="movePage(${i},1)" title="Move right">→</button><button onclick="removePage(${i})">Delete</button></div></div>`).join('')}</div></div>`}async function addProject(){let p={id:id(),title:'Untitled Collection',category:'Fashion Collection',year:new Date().getFullYear().toString(),description:'',pages:[]};projects.unshift(p);await save();openProject(p.id)}async function saveProjectInfo(){let p=projects.find(x=>x.id===active);p.title=$('#ptitle').value;p.category=$('#pcategory').value;p.year=$('#pyear').value;p.description=$('#pdesc').value;await save();render()}function readFile(f){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}async function addImages(e){let files=[...e.target.files];if(!files.length)return;let p=projects.find(x=>x.id===active);try{for(let f of files){if(!f.type.startsWith('image/'))continue;p.pages.push({image:await readFile(f),caption:f.name.replace(/\.[^.]+$/,'')})}await save();page=p.pages.length-1;render()}catch(err){alert('Could not save images. Browser storage may be full. Try smaller JPG/WebP images and export a backup.')}}async function movePage(i,dir){let p=projects.find(x=>x.id===active),j=i+dir;if(j<0||j>=p.pages.length)return;[p.pages[i],p.pages[j]]=[p.pages[j],p.pages[i]];page=j;await save();render()}async function removePage(i){if(!confirm('Remove this image?'))return;let p=projects.find(x=>x.id===active);p.pages.splice(i,1);await save();render()}async function deleteProject(){if(!confirm('Delete this entire collection?'))return;projects=projects.filter(p=>p.id!==active);await save();goHome()}function prevPage(){page=Math.max(0,page-1);render()}function nextPage(){let p=projects.find(x=>x.id===active);page=Math.min(p.pages.length-1,page+1);render()}function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function exportBackup(){download('fashion-portfolio-backup.json',JSON.stringify({settings,projects}), 'application/json')}async function importBackup(e){let f=e.target.files[0];if(!f)return;if(!confirm('Replace your current portfolio with this backup?'))return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.projects)||!obj.settings)throw Error('Invalid backup');projects=obj.projects;settings=obj.settings;await save();goHome();alert('Backup imported.')}catch(err){alert('Import failed: '+err.message)}}document.addEventListener('keydown',e=>{if(view==='project'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){if(e.key==='ArrowRight')nextPage();if(e.key==='ArrowLeft')prevPage()}});(async()=>{db=await openDB();projects=await get('projects')||[{id:'yang',title:'YANG',category:'Concept Collection',year:'2026',description:'An exploration of sheep and goat as contrasting symbols of conformity and independence.',pages:[]},{id:'nightmare',title:'NIGHTMARE',category:'Concept Collection',year:'2026',description:'A journey through recurring dreams, fear and acceptance.',pages:[]}];settings=await get('settings')||settings;$('#year').textContent=new Date().getFullYear();render()})().catch(e=>{document.querySelector('#app').innerHTML='<p>Local storage is unavailable. Please open this page in a standard browser window.</p>'});
</script></body></html>
